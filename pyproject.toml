[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fisher-lda"
version = "0.1.0"
description = "Fisher's Linear Discriminant Analysis implemented from scratch in NumPy"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
